<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion du Championnat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="championship.js" defer></script>
</head>
<body>
    <div class="container" style="width: 90%; margin: 20px auto;">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <button onclick="window.location.href='room.html'" style="background: #555; color: white; margin-bottom: 10px;">
                    <i class="fas fa-arrow-left"></i> Retour à la salle
                </button>
                <h1 id="championshipTitle">Chargement...</h1>
            </div>
            <div id="roomBadge" style="background: chocolate; padding: 10px; border-radius: 8px; color: white;">
                Salle : <span id="roomNameDisplay">-</span>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px;">
            <div class="container-L" style="width: 100%;">
                <h3><i class="fas fa-users"></i> Joueurs du Championnat</h3>
                <div class="action-box">
                    <button onclick="addPlayerIdentity()"      style="background: #4CAF50;">Ajouter Joueur</button>
                    <button onclick="openPlayerImportDialog()" style="background: #4CAF50;">Importer Liste Joueurs</button>
                </div>
                <ul id="playerList" style="list-style: none; padding: 0; margin-top: 15px;">
                    </ul>
            </div>

            <div class="container-R" style="width: 100%;">
                <h3><i class="fas fa-trophy"></i> Tournois de la Saison</h3>
                <button onclick="createNewTournament()" style="background: chocolate; color: white; width: 100%; padding: 10px; margin-bottom: 15px;">
                    Ajouter un Tournoi au Championnat
                </button>
                
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Nom</th>
                            <th>Joueurs</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tournamentTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <dialog id="player-import-dialog" aria-labelledby="player-import-title">
        <div class="player-import-header">
            <h2 id="player-import-title">Importer des joueurs</h2>
            <button type="button" class="player-import-close" onclick="closePlayerImportDialog()" aria-label="Fermer">&times;</button>
        </div>
        <div class="player-import-tabs" role="tablist" aria-label="Source d'importation">
            <button type="button" id="import-file-tab" class="active" role="tab" aria-selected="true" onclick="showPlayerImportSource('file')">Fichier CSV</button>
            <button type="button" id="import-url-tab" role="tab" aria-selected="false" onclick="showPlayerImportSource('url')">Lien Internet</button>
        </div>
        <section id="import-file-panel" class="player-import-panel" role="tabpanel" aria-labelledby="import-file-tab">
            <label for="player-import-file">Fichier CSV ou TSV</label>
            <input id="player-import-file" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values">
            <button type="button" onclick="importPlayersFromFile()">Importer le fichier</button>
        </section>
        <section id="import-url-panel" class="player-import-panel" role="tabpanel" aria-labelledby="import-url-tab" hidden>
            <label for="player-import-url">URL d'un CSV ou d'une Google Sheet</label>
            <input id="player-import-url" type="url" placeholder="https://docs.google.com/spreadsheets/..." autocomplete="url">
            <button type="button" onclick="importPlayersFromUrl()">Charger et importer</button>
        </section>
        <p id="player-import-status" role="status" aria-live="polite"></p>
    </dialog>
</body>
</html>
